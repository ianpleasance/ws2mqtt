; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = default

; Shared settings for all environments
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_filters = esp32_exception_decoder
upload_speed = 115200
monitor_speed = 19200

; Libraries required by the ESP32 firmware
lib_deps =
    bblanchon/ArduinoJson@^6.19.1
    knolleary/PubSubClient@^2.8
    siara-cc/Sqlite3Esp32@^2.3

; Normal USB build and upload
[env:default]
build_flags =

; Over-the-air WiFi upload
[env:esp32_ota]
upload_protocol = espota

; Uncomment and set the ESP32 IP address for OTA uploads
; upload_port = 192.168.1.100

; Must match OTA_PASSWORD in credentials.h
upload_flags = --auth=WS2MQTTPassword

; Integration testing
[env:integration_test]
build_flags = -D INTEGRATION_TEST=1

